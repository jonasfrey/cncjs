<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G-code Generator — Spiral Relief</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1e1e1e;
    color: #d4d4d4;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #252526;
    border-bottom: 1px solid #3c3c3c;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
  header .actions { display: flex; gap: 8px; margin-left: auto; }
  button {
    padding: 6px 14px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  button:active { transform: scale(0.97); }
  .btn-gen { background: #0e639c; color: #fff; }
  .btn-gen:hover { background: #1177bb; }
  .btn-dl  { background: #4a4a4a; color: #fff; }
  .btn-dl:hover { background: #5a5a5a; }
  .btn-copy { background: #4a4a4a; color: #fff; }
  .btn-copy:hover { background: #5a5a5a; }

  .layout { display: flex; flex: 1; overflow: hidden; }
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: #252526;
    border-right: 1px solid #3c3c3c;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: #888; margin-bottom: 2px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 12px; color: #aaa; }
  .field input, .field select {
    background: #3c3c3c;
    border: 1px solid #555;
    border-radius: 3px;
    color: #e0e0e0;
    padding: 5px 8px;
    font-size: 13px;
    font-family: inherit;
  }
  .field input:focus, .field select:focus { outline: none; border-color: #0e639c; }
  .row2 { display: flex; gap: 8px; }
  .row2 .field { flex: 1; }
  .preview-box {
    border: 1px solid #3c3c3c;
    border-radius: 4px;
    background: #1e1e1e;
    overflow: hidden;
    aspect-ratio: 1;
  }
  .preview-box canvas { width: 100%; height: 100%; display: block; }

  .editor-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #editor { flex: 1; }

  /* toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 8px 20px; border-radius: 6px;
    font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>G-code Generator — Spiral Relief</h1>
  <div class="actions">
    <button class="btn-gen" onclick="generate()">Generate</button>
    <button class="btn-dl" onclick="download()">Download .gcode</button>
    <button class="btn-copy" onclick="copyToClipboard()">Copy</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <h2>Tool &amp; Material</h2>
    <div class="row2">
      <div class="field">
        <label>Tool Diameter (mm)</label>
        <input id="toolDia" type="number" value="3.175" step="0.1" min="0.1" onchange="generate()">
      </div>
      <div class="field">
        <label>Tool Type</label>
        <select id="toolType" onchange="generate()">
          <option value="flat">Flat end mill</option>
          <option value="ball" selected>Ball nose</option>
          <option value="vbit">V-bit 90°</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Stepover (% of tool diameter)</label>
      <input id="stepover" type="number" value="30" min="5" max="100" step="1" onchange="generate()">
    </div>

    <h2>Spiral Geometry</h2>
    <div class="row2">
      <div class="field">
        <label>Outer Diameter (mm)</label>
        <input id="outerDia" type="number" value="60" min="5" max="300" step="1" onchange="generate()">
      </div>
      <div class="field">
        <label>Direction</label>
        <select id="direction" onchange="generate()">
          <option value="outward">Center → Out</option>
          <option value="inward">Out → Center</option>
        </select>
      </div>
    </div>

    <h2>Cutting Depths</h2>
    <div class="row2">
      <div class="field">
        <label>Max Depth (mm)</label>
        <input id="maxDepth" type="number" value="2" min="0.1" max="20" step="0.1" onchange="generate()">
      </div>
      <div class="field">
        <label>Depth Per Pass (mm)</label>
        <input id="depthPerPass" type="number" value="0.5" min="0.05" max="5" step="0.05" onchange="generate()">
      </div>
    </div>

    <h2>Speeds &amp; Heights</h2>
    <div class="row2">
      <div class="field">
        <label>Feed Rate — movement speed (mm/min)</label>
        <input id="feedRate" type="number" value="800" min="50" max="5000" step="10" onchange="generate()">
      </div>
      <div class="field">
        <label>Plunge Rate — Z down speed (mm/min)</label>
        <input id="plungeRate" type="number" value="300" min="50" max="3000" step="10" onchange="generate()">
      </div>
    </div>
    <div class="field">
      <label>Safe Z — clearance height (mm)</label>
      <input id="safeZ" type="number" value="5" min="1" max="50" step="0.5" onchange="generate()">
    </div>

    <div class="preview-box"><canvas id="preview"></canvas></div>
  </aside>

  <div class="editor-wrap">
    <div id="editor"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<script>
  let monacoEditor;

  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
  require(['vs/editor/editor.main'], function () {
    monaco.editor.defineTheme('cncDark', {
      base: 'vs-dark',
      inherit: true,
      rules: [
        { token: 'gcode.cmd', foreground: '569cd6', fontStyle: 'bold' },
        { token: 'gcode.coord', foreground: '9cdcfe' },
        { token: 'gcode.value', foreground: 'b5cea8' },
        { token: 'gcode.comment', foreground: '6a9955', fontStyle: 'italic' },
        { token: 'gcode.feed', foreground: 'ce9178' },
        { token: 'keyword', foreground: 'c586c0' }
      ],
      colors: { 'editor.background': '#1e1e1e' }
    });

    monaco.languages.register({ id: 'gcode' });
    monaco.languages.setMonarchTokensProvider('gcode', {
      tokenizer: {
        root: [
          [/[gG]\s*\d+(\.\d+)?/, 'gcode.cmd'],
          [/([XYZIJKR])\s*(-?\d+(\.\d+)?)/, ['gcode.coord', 'gcode.value']],
          [/[fF]\s*\d+(\.\d+)?/, 'gcode.feed'],
          [/[sS]\s*\d+(\.\d+)?/, 'gcode.feed'],
          [/[mMtT]\s*\d+/, 'keyword'],
          [/\(.*?\)/, 'gcode.comment'],
          [/;.*$/, 'gcode.comment'],
          [/-?\d+(\.\d+)?/, 'gcode.value']
        ]
      }
    });

    monacoEditor = monaco.editor.create(document.getElementById('editor'), {
      value: '',
      language: 'gcode',
      theme: 'cncDark',
      fontSize: 14,
      lineNumbers: 'on',
      minimap: { enabled: false },
      scrollBeyondLastLine: false,
      automaticLayout: true,
      wordWrap: 'off',
      tabSize: 2
    });

    generate();
  });

  // --- Parameter readers ---
  function p(id) { return parseFloat(document.getElementById(id).value); }

  // --- G-code generation ---
  function generate() {
    if (!monacoEditor) return;

    const toolDia     = p('toolDia');
    const toolType    = document.getElementById('toolType').value;
    const stepoverPct = p('stepover');
    const outerDia    = p('outerDia');
    const maxDepth    = p('maxDepth');
    const depthPerPass = p('depthPerPass');
    const feedRate    = p('feedRate');
    const plungeRate  = p('plungeRate');
    const safeZ       = p('safeZ');
    const direction   = document.getElementById('direction').value;

    const outerR = outerDia / 2;
    const stepover = toolDia * (stepoverPct / 100);
    const arcsPerPass = Math.ceil(outerR / stepover);
    const numPasses = Math.ceil(maxDepth / depthPerPass);

    let lines = [];
    lines.push('( Spiral Relief G-code )');
    lines.push(`( Tool: ${toolType} ${toolDia}mm, Stepover: ${stepoverPct}% )`);
    lines.push(`( Outer dia: ${outerDia}mm, Max depth: ${maxDepth}mm, Passes: ${numPasses} x ${depthPerPass}mm )`);
    lines.push(`( Feed rate: ${feedRate}mm/min, Plunge: ${plungeRate}mm/min )`);
    lines.push('');
    lines.push('G21         ( mm units )');
    lines.push('G90         ( absolute positioning )');
    lines.push('G17         ( XY plane )');
    lines.push(`G0 Z${safeZ.toFixed(3)}  ( go to safe height )`);
    lines.push('G0 X0 Y0    ( go to center )');
    lines.push('');

    const angleStep = 0.05; // radian resolution per line segment
    const totalAngle = arcsPerPass * 2 * Math.PI;

    // Precompute all points for a single spiral at given radius, reversed if inward
    function* spiralPoints(maxR, reverse) {
      const steps = Math.ceil(totalAngle / angleStep);
      for (let i = 0; i <= steps; i++) {
        let frac = i / steps;
        if (reverse) frac = 1 - frac;
        const a = frac * totalAngle;
        const r = (frac * maxR);
        const x = r * Math.cos(a);
        const y = r * Math.sin(a);
        yield { x, y, a, r };
      }
    }

    for (let pass = 0; pass < numPasses; pass++) {
      const targetZ = Math.min((pass + 1) * depthPerPass, maxDepth);
      const inward = direction === 'inward';
      const points = [...spiralPoints(outerR, inward)];

      if (pass === 0) {
        // First pass: plunge at the start point (center if outward, outer edge if inward)
        const start = points[0];
        lines.push(`( Pass ${pass + 1}/${numPasses} — target Z: -${targetZ.toFixed(3)} )`);
        lines.push(`G0 X${start.x.toFixed(3)} Y${start.y.toFixed(3)}`);
        lines.push(`G1 Z-${targetZ.toFixed(3)} F${plungeRate.toFixed(0)}`);
      } else {
        const start = points[0];
        lines.push(`( Pass ${pass + 1}/${numPasses} — target Z: -${targetZ.toFixed(3)} )`);
        lines.push(`G0 Z${safeZ.toFixed(3)}`);
        lines.push(`G0 X${start.x.toFixed(3)} Y${start.y.toFixed(3)}`);
        lines.push(`G1 Z-${targetZ.toFixed(3)} F${plungeRate.toFixed(0)}`);
      }

      // Cut the spiral
      lines.push(`G1 F${feedRate.toFixed(0)}`);
      for (let i = 1; i < points.length; i++) {
        const pt = points[i];
        lines.push(`X${pt.x.toFixed(3)} Y${pt.y.toFixed(3)} Z-${targetZ.toFixed(3)}`);
      }
      lines.push('');
    }

    lines.push(`G0 Z${safeZ.toFixed(3)}  ( retract )`);
    lines.push('G0 X0 Y0    ( go home )');
    lines.push('M2           ( end program )');
    lines.push('');

    const gcode = lines.join('\n');
    monacoEditor.setValue(gcode);
    drawPreview(outerR, arcsPerPass);
  }

  // --- Canvas preview ---
  function drawPreview(outerR, arcs) {
    const canvas = document.getElementById('preview');
    const dpr = window.devicePixelRatio || 1;
    const size = canvas.parentElement.clientWidth;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const cx = size / 2, cy = size / 2;
    const scale = (size * 0.85) / (outerR * 2);

    ctx.fillStyle = '#1e1e1e';
    ctx.fillRect(0, 0, size, size);

    // Draw stock circle
    ctx.beginPath();
    ctx.arc(cx, cy, outerR * scale, 0, Math.PI * 2);
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Draw spiral
    const totalAngle = arcs * 2 * Math.PI;
    const steps = Math.ceil(totalAngle / 0.05);
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const frac = i / steps;
      const r = frac * outerR;
      const a = frac * totalAngle;
      const x = cx + r * Math.cos(a) * scale;
      const y = cy + r * Math.sin(a) * scale;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = '#0e639c';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Draw crosshair at center
    const ch = 10;
    ctx.beginPath();
    ctx.moveTo(cx - ch, cy); ctx.lineTo(cx + ch, cy);
    ctx.moveTo(cx, cy - ch); ctx.lineTo(cx, cy + ch);
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // --- Download ---
  function download() {
    if (!monacoEditor) return;
    const gcode = monacoEditor.getValue();
    const blob = new Blob([gcode], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'spiral-relief.gcode';
    a.click();
    URL.revokeObjectURL(url);
    toast('Downloaded spiral-relief.gcode');
  }

  // --- Copy ---
  function copyToClipboard() {
    if (!monacoEditor) return;
    navigator.clipboard.writeText(monacoEditor.getValue()).then(() => toast('Copied!'));
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._tid);
    el._tid = setTimeout(() => el.classList.remove('show'), 1800);
  }

  window.addEventListener('resize', () => {
    if (monacoEditor) monacoEditor.layout();
    const outerR = p('outerDia') / 2;
    const stepover = p('toolDia') * (p('stepover') / 100);
    drawPreview(outerR, Math.ceil(outerR / stepover));
  });
</script>
</body>
</html>
